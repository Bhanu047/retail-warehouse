version: 2

models:
  - name: stg_customers
    description: One row per customer. Source duplicates are collapsed here.
    columns:
      - name: customer_id
        description: Primary key. Unique here even though the source is not.
        data_tests: [unique, not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["US", "GB", "DE", "FR", "CA", "AU"]
      - name: signup_date
        data_tests: [not_null]

  - name: stg_products
    description: One row per product. Prices stay in integer cents.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]
      - name: unit_price_cents
        data_tests: [not_null, positive_or_zero]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ["Audio", "Wearables", "Home", "Accessories", "Lighting"]

  - name: stg_orders
    description: >
      One row per order header. Cancelled and returned orders are kept and
      flagged rather than filtered, so the rates stay measurable.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        description: >
          Not tested for referential integrity: an order can legitimately
          arrive before the customer export catches up. fct_orders labels
          those rather than dropping them, and a singular test bounds how
          many are acceptable.
        data_tests: [not_null]
      - name: ordered_at
        data_tests: [not_null, not_in_the_future]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["completed", "shipped", "cancelled", "returned"]
      - name: is_revenue
        data_tests: [not_null]

  - name: stg_order_items
    description: One row per order line, with the line total computed once.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests: [not_null, positive_or_zero]
      - name: line_total_cents
        description: Floored at zero, so an over-large discount cannot go negative.
        data_tests: [not_null, positive_or_zero]
